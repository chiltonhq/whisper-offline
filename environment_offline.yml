name: whisper-offline-build
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pyside6
  - pytorch=2.3.*
  - torchaudio=2.3.*
  - huggingface_hub=0.30.2
  - pyinstaller=6.14.2
  - matplotlib
