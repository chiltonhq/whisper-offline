name: whisper-offline-build
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pyside6
  - pytorch=2.3.*
  - torchaudio=2.3.*
  - huggingface_hub=0.30.2
  - pyinstaller=6.14.2
  - matplotlib
  # zlibwapi.dll for the optional GPU add-on: cuDNN 8.9 on Windows loads it
  # at runtime. Only copied into the add-on, never into the main app.
  - conda-forge::zlib-wapi=1.3.2
  - pip
  - pip:
      - setuptools<81
      - ctranslate2==4.3.1
      - faster-whisper==1.1.1
      - av==17.1.0
      - pyannote.audio==3.3.2
      - speechbrain==1.0.2
